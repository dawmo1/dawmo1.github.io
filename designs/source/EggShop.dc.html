<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pet egg shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;family=Fredoka:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE45C}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, #FF9A3D 0%, #E8541C 45%, #8E2A0E 100%); font-family: 'Fredoka', sans-serif; font-weight: 700; color: #FFFFFF">

<div style="position: absolute; left: 640px; top: 300px; width: 1400px; height: 1400px; transform: translate(-50%, -50%); background: repeating-conic-gradient(rgba(255,230,140,0.28) 0deg 10deg, rgba(255,230,140,0) 10deg 20deg); -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 55%); mask-image: radial-gradient(circle, #000 10%, transparent 55%)" aria-hidden="true"></div>

<div style="position: absolute; left: 50%; top: 20px; transform: translateX(-50%); font-family: 'Luckiest Guy', cursive; font-size: 60px; letter-spacing: 2px; color: #FFFFFF; -webkit-text-stroke: 10px #2B0D02; paint-order: stroke fill; text-shadow: 0 6px 0 #2B0D02; white-space: nowrap">INFERNO EGG</div>

<div style="position: absolute; right: 24px; top: 16px; display: flex; gap: 12px">
<sc-for list="{{wallet}}" as="w" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 8px; background: rgba(43,13,2,0.55); border: 4px solid #2B0D02; border-radius: 999px; padding: 3px 3px 3px 6px; font-size: 22px; -webkit-text-stroke: 5px #2B0D02; paint-order: stroke fill">
<span style="width: 30px; height: 30px; border-radius: 50%; background: {{w.bg}}; border: 3px solid #2B0D02"></span>{{w.amount}}
<button aria-label="{{w.add}}" style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #8CF25B, #2FB52A); border: 3px solid #2B0D02; color: #FFFFFF; font-family: inherit; font-size: 22px; line-height: 1; padding: 0; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill">+</button>
</div>
</sc-for>
<button aria-label="Close shop" style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(180deg, #FF6B6B, #D61F2C); border: 4px solid #2B0D02; box-shadow: 0 5px 0 #2B0D02; color: #FFFFFF; font-family: inherit; font-size: 24px; -webkit-text-stroke: 5px #2B0D02; paint-order: stroke fill">✕</button>
</div>

<div style="position: absolute; left: 24px; top: 110px; width: 230px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{eggs}}" as="e" hint-placeholder-count="4">
<button style="position: relative; display: flex; align-items: center; gap: 10px; min-height: 104px; padding: 6px 12px 6px 6px; border-radius: 20px; background: {{e.bg}}; border: 4px solid {{e.border}}; box-shadow: 0 6px 0 #2B0D02; font-family: inherit; color: #FFFFFF; text-align: left">
<sc-if value="{{e.is_egg_frost}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_frost" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if><sc-if value="{{e.is_egg_grass}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_grass" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if><sc-if value="{{e.is_egg_inferno}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_inferno" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if><sc-if value="{{e.is_egg_void}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_void" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if><sc-if value="{{e.is_pet_blockpup}}" hint-placeholder-val="{{ false }}"><img src="IMG_pet_blockpup" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if><sc-if value="{{e.is_pet_emberfox}}" hint-placeholder-val="{{ false }}"><img src="IMG_pet_emberfox" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if><sc-if value="{{e.is_pet_slime}}" hint-placeholder-val="{{ false }}"><img src="IMG_pet_slime" alt="" style="width: 84px; height: 92px; object-fit: contain; filter: {{e.filter}}"></sc-if>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; -webkit-text-stroke: 5px #2B0D02; paint-order: stroke fill">{{e.name}}</span>
<span style="font-size: 16px; color: {{e.priceColor}}; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill">{{e.price}}</span>
</span>
<sc-if value="{{e.locked}}" hint-placeholder-val="{{ false }}"><svg style="position: absolute; right: 10px; top: 10px" width="24" height="26" viewBox="0 0 24 26" aria-label="Locked" role="img"><rect x="3" y="11" width="18" height="13" rx="3" fill="#FFFFFF" stroke="#2B0D02" stroke-width="3"></rect><path d="M7 11 V8 A5 5 0 0 1 17 8 V11" fill="none" stroke="#2B0D02" stroke-width="3"></path></svg></sc-if>
</button>
</sc-for>
</div>

<img src="IMG_egg_inferno" alt="Inferno egg" style="position: absolute; left: 50%; top: 104px; height: 360px; transform: translateX(-50%) rotate(-6deg); filter: drop-shadow(0 14px 0 rgba(43,13,2,0.45))">
<div style="position: absolute; left: 50%; top: 470px; transform: translateX(-50%); width: 300px; height: 30px; border-radius: 50%; background: rgba(43,13,2,0.35)" aria-hidden="true"></div>

<div style="position: absolute; right: 24px; top: 104px; width: 300px; padding: 14px; border-radius: 22px; background: rgba(43,13,2,0.55); border: 4px solid #2B0D02; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 20px; text-align: center; -webkit-text-stroke: 5px #2B0D02; paint-order: stroke fill">Can hatch</div>
<sc-for list="{{pets}}" as="p" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 16px; background: {{p.bg}}; border: 3px solid #2B0D02">
<div style="width: 52px; height: 52px; border-radius: 12px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center">
<sc-if value="{{p.img}}" hint-placeholder-val="{{ true }}"><sc-if value="{{p.is_egg_frost}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_frost" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if><sc-if value="{{p.is_egg_grass}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_grass" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if><sc-if value="{{p.is_egg_inferno}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_inferno" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if><sc-if value="{{p.is_egg_void}}" hint-placeholder-val="{{ false }}"><img src="IMG_egg_void" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if><sc-if value="{{p.is_pet_blockpup}}" hint-placeholder-val="{{ false }}"><img src="IMG_pet_blockpup" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if><sc-if value="{{p.is_pet_emberfox}}" hint-placeholder-val="{{ false }}"><img src="IMG_pet_emberfox" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if><sc-if value="{{p.is_pet_slime}}" hint-placeholder-val="{{ false }}"><img src="IMG_pet_slime" alt="" style="width: 50px; height: 50px; object-fit: contain; filter: {{p.filter}}"></sc-if></sc-if>
<sc-if value="{{p.secret}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Luckiest Guy', cursive; font-size: 34px; -webkit-text-stroke: 6px #2B0D02; paint-order: stroke fill">?</span></sc-if>
</div>
<span style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 18px; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill">{{p.name}}</span>
<span style="font-size: 15px; color: #FFF3C4; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill">{{p.rarity}}</span>
</span>
<span style="font-size: 20px; -webkit-text-stroke: 5px #2B0D02; paint-order: stroke fill">{{p.chance}}</span>
</div>
</sc-for>
<div style="align-self: center; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 6px; border-radius: 999px; background: linear-gradient(180deg, #8CF25B, #2FB52A); border: 3px solid #2B0D02; font-size: 17px; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><g fill="#FFFFFF" stroke="#2B0D02" stroke-width="2"><circle cx="9" cy="9" r="5"></circle><circle cx="17" cy="9" r="5"></circle><circle cx="9" cy="17" r="5"></circle><circle cx="17" cy="17" r="5"></circle></g><path d="M13 13 L19 24" stroke="#2B0D02" stroke-width="2.5"></path></svg>2× LUCK 14:32
</div>
</div>

<div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 16px; align-items: flex-end">
<sc-for list="{{buttons}}" as="b" hint-placeholder-count="3">
<button style="position: relative; width: {{b.w}}; min-height: 92px; border-radius: 22px; background: {{b.bg}}; border: 5px solid #2B0D02; box-shadow: 0 8px 0 #2B0D02, inset 0 -6px 0 rgba(0,0,0,0.18); font-family: inherit; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: 'Luckiest Guy', cursive; font-size: 30px; letter-spacing: 1px; -webkit-text-stroke: 7px #2B0D02; paint-order: stroke fill">{{b.label}}</span>
<span style="font-size: 17px; display: flex; align-items: center; gap: 6px; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFD23F; border: 3px solid #2B0D02"></span>{{b.price}}</span>
<sc-if value="{{b.tag}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -18px; right: -10px; padding: 2px 10px; border-radius: 999px; background: #FF3B6B; border: 3px solid #2B0D02; font-size: 14px; -webkit-text-stroke: 3px #2B0D02; paint-order: stroke fill">{{b.tag}}</span></sc-if>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 50%; top: 88px; transform: translateX(-50%); padding: 3px 14px; border-radius: 999px; background: rgba(43,13,2,0.55); border: 3px solid #2B0D02; font-size: 16px; -webkit-text-stroke: 4px #2B0D02; paint-order: stroke fill">Pets 38 / 50</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {
wallet: [
{ amount: '2.4M', bg: 'radial-gradient(circle at 35% 35%, #FFF08A, #FFB800)', add: 'Buy coins' },
{ amount: '1,250', bg: 'radial-gradient(circle at 35% 35%, #B8F7FF, #2DB7FF)', add: 'Buy gems' }
],
eggs: [
{ name: 'Grass Egg', price: '500', img: 'IMG_egg_grass', is_egg_grass: true, bg: 'linear-gradient(180deg,#8CE05A,#3E9E2A)', border: '#2B0D02', priceColor: '#FFE45C', filter: 'none' },
{ name: 'Frost Egg', price: '25K', img: 'IMG_egg_frost', is_egg_frost: true, bg: 'linear-gradient(180deg,#8FE9FF,#2D8BD6)', border: '#2B0D02', priceColor: '#FFE45C', filter: 'none' },
{ name: 'Inferno Egg', price: '250K', img: 'IMG_egg_inferno', is_egg_inferno: true, bg: 'linear-gradient(180deg,#FFD25E,#FF8A2B)', border: '#FFFFFF', priceColor: '#FFFFFF', filter: 'none' },
{ name: 'Void Egg', price: 'Rebirth 5', img: 'IMG_egg_void', is_egg_void: true, bg: 'linear-gradient(180deg,#6B5A80,#3D3150)', border: '#2B0D02', priceColor: '#E0D4FF', filter: 'grayscale(0.6) brightness(0.7)', locked: true }
],
pets: [
{ name: 'Mochi', rarity: 'Common', chance: '70%', img: 'IMG_pet_slime', is_pet_slime: true, filter: 'none', bg: 'linear-gradient(90deg,#9AA4B2,#6B7480)' },
{ name: 'Blockpup', rarity: 'Rare', chance: '24%', img: 'IMG_pet_blockpup', is_pet_blockpup: true, filter: 'none', bg: 'linear-gradient(90deg,#4AA3FF,#2361C9)' },
{ name: 'Frostpup', rarity: 'Epic', chance: '4%', img: 'IMG_pet_blockpup', is_pet_blockpup: true, filter: 'hue-rotate(170deg) saturate(1.4)', bg: 'linear-gradient(90deg,#C98BFF,#7A35D6)' },
{ name: 'Emberfox', rarity: 'Legendary', chance: '1.9%', img: 'IMG_pet_emberfox', is_pet_emberfox: true, filter: 'none', bg: 'linear-gradient(90deg,#FFB020,#FF5E1A)' },
{ name: 'Secret', rarity: 'Secret', chance: '0.1%', secret: true, img: '', bg: 'linear-gradient(90deg,#3A3A48,#15151C)' }
],
buttons: [
{ label: 'OPEN', price: '250K', w: '200px', bg: 'linear-gradient(180deg,#8CF25B,#2FB52A)' },
{ label: 'OPEN ×3', price: '750K', w: '220px', bg: 'linear-gradient(180deg,#5AD8FF,#1F8DE0)', tag: 'GAMEPASS' },
{ label: 'AUTO', price: '250K', w: '170px', bg: 'linear-gradient(180deg,#C98BFF,#8A3FE0)' }
]
};
}
}
</script>
</body>
</html>
