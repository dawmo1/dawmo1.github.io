<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voltline arena HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22E6FF}a:hover{color:#9DF4FF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1A1F2A; font-family: 'Chakra Petch', sans-serif; color: #FFFFFF">

<div style="position: absolute; inset: 0; filter: blur(10px); transform: scale(1.04)" aria-hidden="true">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 400px; background: linear-gradient(180deg, #2E3647 0%, #3B4458 100%)"></div>
<div style="position: absolute; left: 0; right: 0; top: 400px; bottom: 0; background: linear-gradient(180deg, #4A4F5C 0%, #2A2E36 100%)"></div>
<div style="position: absolute; left: 80px; top: 150px; width: 300px; height: 270px; background: #565E70"></div>
<div style="position: absolute; left: 80px; top: 150px; width: 300px; height: 14px; background: #FF2E88"></div>
<div style="position: absolute; left: 920px; top: 120px; width: 330px; height: 300px; background: #4D5568"></div>
<div style="position: absolute; left: 920px; top: 120px; width: 330px; height: 14px; background: #22E6FF"></div>
<div style="position: absolute; left: 470px; top: 290px; width: 360px; height: 130px; background: #5F6779"></div>
<div style="position: absolute; left: 560px; top: 60px; width: 200px; height: 200px; border-radius: 50%; background: #FFE2B8; opacity: 0.55"></div>
</div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%)" aria-hidden="true"></div>

<div style="position: absolute; left: 700px; top: 238px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; color: #FFFFFF; -webkit-text-stroke: 4px #0B0E14; paint-order: stroke fill">drift99</div>
<div style="width: 64px; height: 8px; background: #0B0E14; border: 2px solid #0B0E14; border-radius: 3px"><div style="width: 38%; height: 100%; background: #FF3B4E; border-radius: 2px"></div></div>
<img src="IMG_avatar_red" alt="Enemy player" style="height: 170px; filter: drop-shadow(0 0 6px rgba(255, 46, 136, 0.8))">
</div>

<div style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: stretch; filter: drop-shadow(0 4px 0 #0B0E14)">
<div style="background: linear-gradient(180deg, #5AF0FF, #12B8D6); color: #0B0E14; padding: 4px 22px 6px; border: 3px solid #0B0E14; border-right: 0; border-radius: 12px 0 0 12px; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 14px; font-weight: 700">ION</span><span style="font-size: 38px; font-weight: 700; line-height: 1">3</span>
</div>
<div style="background: #0B0E14; padding: 6px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 3px solid #0B0E14; border-bottom: 3px solid #0B0E14">
<span style="font-size: 32px; font-weight: 700; line-height: 1">02:41</span>
<span style="font-size: 14px; font-weight: 600; color: #B7C3D6">FIRST TO 5</span>
</div>
<div style="background: linear-gradient(180deg, #FF6FB0, #E0176E); color: #0B0E14; padding: 4px 22px 6px; border: 3px solid #0B0E14; border-left: 0; border-radius: 0 12px 12px 0; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 14px; font-weight: 700">FLUX</span><span style="font-size: 38px; font-weight: 700; line-height: 1">2</span>
</div>
</div>

<div style="position: absolute; right: 20px; top: 14px; width: 148px; height: 148px; border-radius: 20px; background: rgba(11, 14, 20, 0.82); border: 3px solid #0B0E14; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12); overflow: hidden">
<svg width="142" height="142" viewBox="0 0 142 142" aria-hidden="true">
<rect x="18" y="20" width="44" height="34" rx="4" fill="#2A3242"></rect><rect x="80" y="76" width="46" height="40" rx="4" fill="#2A3242"></rect><rect x="54" y="62" width="30" height="16" rx="3" fill="#2A3242"></rect>
<circle cx="110" cy="34" r="6" fill="#FF2E88" stroke="#0B0E14" stroke-width="2"></circle><circle cx="30" cy="112" r="6" fill="#FF2E88" stroke="#0B0E14" stroke-width="2"></circle><circle cx="48" cy="86" r="5" fill="#22E6FF" stroke="#0B0E14" stroke-width="2"></circle>
<path d="M71 60 L82 86 L71 79 L60 86 Z" fill="#FFFFFF" stroke="#0B0E14" stroke-width="2.5" stroke-linejoin="round"></path>
</svg>
<span style="position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 14px; font-weight: 700; -webkit-text-stroke: 3px #0B0E14; paint-order: stroke fill">REACTOR</span>
</div>

<div style="position: absolute; right: 20px; top: 176px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
<sc-for list="{{feed}}" as="k" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px; background: rgba(11, 14, 20, 0.82); border: 2px solid #0B0E14; border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 15px; opacity: {{k.op}}; box-shadow: inset 0 0 0 2px {{k.ring}}">
<span style="color: {{k.aColor}}">{{k.a}}</span>
<sc-if value="{{k.blaster}}" hint-placeholder-val="{{ true }}"><svg width="30" height="14" viewBox="0 0 30 14" aria-label="Blaster" role="img"><path d="M2 4 H20 L24 2 H28 V8 H20 L16 12 H11 L12 8 H2 Z" fill="#FFFFFF"></path></svg></sc-if>
<sc-if value="{{k.sword}}" hint-placeholder-val="{{ false }}"><svg width="30" height="14" viewBox="0 0 30 14" aria-label="Blade" role="img"><path d="M2 7 L22 5 L28 7 L22 9 Z M6 3 H9 V11 H6 Z" fill="#FFFFFF"></path></svg></sc-if>
<sc-if value="{{k.head}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-label="Headshot" role="img"><circle cx="8" cy="7" r="6" fill="#FFD23F" stroke="#0B0E14" stroke-width="1.5"></circle><rect x="5" y="6" width="2" height="2" fill="#0B0E14"></rect><rect x="9" y="6" width="2" height="2" fill="#0B0E14"></rect></svg></sc-if>
<span style="color: {{k.vColor}}">{{k.v}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%)" aria-hidden="true">
<svg width="40" height="40" viewBox="0 0 40 40"><g stroke="#0B0E14" stroke-width="6" stroke-linecap="round"><line x1="20" y1="4" x2="20" y2="13"></line><line x1="20" y1="27" x2="20" y2="36"></line><line x1="4" y1="20" x2="13" y2="20"></line><line x1="27" y1="20" x2="36" y2="20"></line></g><g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><line x1="20" y1="4" x2="20" y2="13"></line><line x1="20" y1="27" x2="20" y2="36"></line><line x1="4" y1="20" x2="13" y2="20"></line><line x1="27" y1="20" x2="36" y2="20"></line></g></svg>
</div>

<div style="position: absolute; left: 50%; top: 452px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="background: linear-gradient(180deg, #FFE066, #FFB020); color: #0B0E14; border: 3px solid #0B0E14; border-radius: 999px; padding: 2px 14px; font-size: 14px; font-weight: 700; box-shadow: 0 3px 0 #0B0E14">DOUBLE KILL</div>
<div style="font-size: 22px; font-weight: 700; -webkit-text-stroke: 5px #0B0E14; paint-order: stroke fill"><span style="color: #FF4FA3">+100</span> ELIMINATED drift99</div>
</div>

<div style="position: absolute; left: 160px; bottom: 120px; width: 150px; height: 150px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.35); background: rgba(11,14,20,0.25)" aria-label="Move joystick" role="img">
<div style="position: absolute; left: 47px; top: 47px; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.6); border: 3px solid #0B0E14"></div>
</div>

<div style="position: absolute; left: 24px; bottom: 24px; width: 380px; display: flex; flex-direction: column; gap: 6px">
<div style="height: 14px; background: #0B0E14; border-radius: 4px; padding: 2px; display: flex; gap: 2px">
<sc-for list="{{shieldSegs}}" as="s" hint-placeholder-count="5"><div style="flex: 1; background: {{s.fill}}; border-radius: 2px"></div></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; height: 30px; background: #0B0E14; border-radius: 6px; padding: 3px">
<div style="height: 100%; width: {{hpPct}}; background: linear-gradient(180deg, #C6FF5E, #6FD62A); border-radius: 4px"></div>
</div>
<span style="font-size: 26px; font-weight: 700; -webkit-text-stroke: 5px #0B0E14; paint-order: stroke fill; white-space: nowrap">{{hp}} <span style="font-size: 18px; color: #5AF0FF">+60</span></span>
</div>
</div>

<div style="position: absolute; right: 24px; bottom: 24px; display: flex; align-items: flex-end; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-end">
<div style="display: flex; gap: 12px">
<sc-for list="{{abilities}}" as="ab" hint-placeholder-count="3">
<button aria-label="{{ab.label}}" style="width: 68px; height: 68px; border-radius: 50%; position: relative; border: 3px solid #0B0E14; background: {{ab.bg}}; box-shadow: 0 4px 0 #0B0E14; padding: 0; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ab.dash}}" hint-placeholder-val="{{ true }}"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M4 17 H22 M16 9 L24 17 L16 25 M26 9 V25" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{ab.shield}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 3 L29 8 V17 C29 24 23 29 17 31 C11 29 5 24 5 17 V8 Z" fill="#FFFFFF" stroke="#0B0E14" stroke-width="2.5"></path></svg></sc-if>
<sc-if value="{{ab.ult}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M19 2 L7 19 H16 L13 32 L27 13 H18 Z" fill="#FFFFFF" stroke="#0B0E14" stroke-width="2.5" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{ab.cooling}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(11,14,20,0.72) {{ab.sweep}}, transparent 0); display: flex; align-items: center; justify-content: center; font-size: {{ab.cdSize}}; font-weight: 700; color: #FFFFFF; -webkit-text-stroke: 4px #0B0E14; paint-order: stroke fill">{{ab.cd}}</span></sc-if>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: rgba(11,14,20,0.82); border: 3px solid #0B0E14; border-radius: 14px; padding: 8px 16px 8px 8px">
<img src="IMG_blaster_ui" alt="Volt Blaster" style="width: 170px; height: 110px; object-fit: contain; margin: -40px 0 -14px -8px">
<div style="display: flex; flex-direction: column; align-items: flex-end">
<span style="font-size: 44px; font-weight: 700; line-height: 0.95">24<span style="font-size: 20px; color: #B7C3D6"> / 120</span></span>
<span style="font-size: 14px; font-weight: 700; color: #8FF3FF">VOLT BLASTER</span>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; align-items: center">
<button aria-label="Reload" style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid #FFFFFF; background: #1A1F2B; box-shadow: 0 4px 0 #0B0E14; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M22 9 A9 9 0 1 0 23 17" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"></path><path d="M17 4 L23 9 L17 13" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button aria-label="Jump" style="width: 72px; height: 72px; border-radius: 50%; border: 3px solid #FFFFFF; background: #1A1F2B; box-shadow: 0 4px 0 #0B0E14; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4 L26 16 H19 V26 H11 V16 H4 Z" fill="#FFFFFF"></path></svg></button>
<button aria-label="Fire" style="width: 104px; height: 104px; border-radius: 50%; border: 4px solid #0B0E14; background: linear-gradient(180deg, #FF6FB0, #E0176E); box-shadow: 0 6px 0 #0B0E14; display: flex; align-items: center; justify-content: center"><svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="15" fill="none" stroke="#FFFFFF" stroke-width="4"></circle><circle cx="23" cy="23" r="4" fill="#FFFFFF"></circle><g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><line x1="23" y1="2" x2="23" y2="10"></line><line x1="23" y1="36" x2="23" y2="44"></line><line x1="2" y1="23" x2="10" y2="23"></line><line x1="36" y1="23" x2="44" y2="23"></line></g></svg></button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"health":{"editor":"range","min":0,"max":100,"step":1,"default":82},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const hp = this.props.health ?? 82;
return {
hp, hpPct: hp + '%',
shieldSegs: [0, 1, 2, 3, 4].map((i) => ({ fill: i < 3 ? '#5AF0FF' : '#26303F' })),
feed: [
{ a: 'You', v: 'drift99', aColor: '#C6FF5E', vColor: '#FF6FB0', ring: 'rgba(198,255,94,0.5)', op: 1, blaster: true, head: true },
{ a: 'NOVA_k', v: 'Glitchbyte', aColor: '#5AF0FF', vColor: '#FF6FB0', ring: 'transparent', op: 0.92, sword: true },
{ a: 'x0Ryn', v: 'Pixelmancer', aColor: '#FF6FB0', vColor: '#5AF0FF', ring: 'transparent', op: 0.75, blaster: true }
],
abilities: [
{ key: 'Q', label: 'Dash, ready in 4 seconds', bg: 'linear-gradient(180deg,#5A6478,#323A4A)', dash: true, cooling: true, sweep: '62%', cd: '4s', cdSize: '20px' },
{ key: 'E', label: 'Barrier, ready', bg: 'linear-gradient(180deg,#5AF0FF,#12B8D6)', shield: true },
{ key: 'F', label: 'Overcharge ultimate, 80 percent', bg: 'linear-gradient(180deg,#FF6FB0,#E0176E)', ult: true, cooling: true, sweep: '20%', cd: '80%', cdSize: '17px' }
]
};
}
}
</script>
</body>
</html>
