<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pitlane kart garage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;family=Inter:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE600}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: linear-gradient(180deg, #23232B 0%, #16161A 55%, #0E0E11 100%); font-family: 'Inter', sans-serif; color: #F4F4F6">

<div style="position: absolute; left: 640px; top: 520px; width: 900px; height: 190px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(ellipse, #3A3A46 0%, #26262E 55%, rgba(22,22,26,0) 72%)" aria-hidden="true"></div>
<div style="position: absolute; left: 640px; top: 520px; width: 600px; height: 120px; transform: translate(-50%, -50%); border-radius: 50%; border-top: 3px solid rgba(255,230,0,0.55)" aria-hidden="true"></div>
<img src="IMG_kart_ui" alt="Rally kart" style="position: absolute; left: 640px; top: 150px; width: 600px; transform: translateX(-50%)">
<button aria-label="Rotate left" style="position: absolute; left: 580px; top: 590px; width: 48px; height: 48px; border-radius: 50%; background: #1F1F26; border: 2px solid #3A3A46; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3 L6 10 L13 17" stroke="#F4F4F6" stroke-width="3" fill="none"></path></svg></button>
<button aria-label="Rotate right" style="position: absolute; left: 652px; top: 590px; width: 48px; height: 48px; border-radius: 50%; background: #1F1F26; border: 2px solid #3A3A46; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3 L14 10 L7 17" stroke="#F4F4F6" stroke-width="3" fill="none"></path></svg></button>

<div style="position: absolute; left: 32px; top: 70px; display: flex; align-items: center; gap: 14px">
<button aria-label="Back" style="width: 48px; height: 48px; border-radius: 12px; background: #1F1F26; border: 2px solid #3A3A46; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3 L6 10 L13 17" stroke="#FFE600" stroke-width="3" fill="none"></path></svg></button>
<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'Russo One', sans-serif; font-size: 40px; line-height: 1">RALLY KART</span><button aria-label="Rename kart" style="width: 32px; height: 32px; border-radius: 8px; background: transparent; border: 2px solid #3A3A46; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12 L3 8 L10 1 L13 4 L6 11 Z" fill="#F4F4F6"></path></svg></button></div>
<span style="font-weight: 600; font-size: 15px; color: #A3A3AD">Class B · 412 races · 38 wins</span>
</div>
</div>

<div style="position: absolute; right: 32px; top: 70px; display: flex; align-items: center; gap: 10px; background: #1F1F26; border: 2px solid #3A3A46; border-radius: 999px; padding: 6px 16px 6px 8px; font-weight: 700; font-size: 18px">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="#FFE600" stroke="#0E0E11" stroke-width="2"></circle><path d="M9 13 H17 M13 9 V17" stroke="#0E0E11" stroke-width="3"></path></svg>18,450
</div>

<div style="position: absolute; left: 32px; top: 170px; width: 250px; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px"><span>{{s.label}}</span><span style="color: {{s.numColor}}">{{s.text}}</span></div>
<div style="display: flex; gap: 3px">
<sc-for list="{{s.segs}}" as="g" hint-placeholder-count="10"><div style="flex: 1; height: 12px; border-radius: 2px; background: {{g.c}}"></div></sc-for>
</div>
</div>
</sc-for>
<div style="font-size: 14px; font-weight: 600; color: #A3A3AD">Previewing: Grip Slicks</div>
</div>

<div style="position: absolute; right: 32px; top: 140px; width: 270px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{parts}}" as="p" hint-placeholder-count="5">
<button style="min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 8px; border-radius: 12px; background: {{p.bg}}; color: {{p.fg}}; border: 2px solid {{p.border}}; font-family: inherit; text-align: left">
<span style="width: 54px; height: 54px; border-radius: 10px; background: {{p.thumbBg}}; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="{{p.icon}}" fill="{{p.iconFill}}" stroke="#0E0E11" stroke-width="2" stroke-linejoin="round"></path></svg></span>
<span style="display: flex; flex-direction: column; flex: 1">
<span style="font-weight: 700; font-size: 13px; opacity: 0.8">{{p.slot}}</span>
<span style="font-family: 'Russo One', sans-serif; font-size: 17px">{{p.name}}</span>
<span style="font-weight: 700; font-size: 13px; color: {{p.statusColor}}">{{p.status}}</span>
</span>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 32px; bottom: 32px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-weight: 700; font-size: 15px; color: #A3A3AD">PAINT</span>
<div style="display: flex; background: #1F1F26; border: 2px solid #3A3A46; border-radius: 999px; padding: 2px">
<sc-for list="{{finishes}}" as="f" hint-placeholder-count="3"><button style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-weight: 700; font-size: 14px">{{f.label}}</button></sc-for>
</div>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="6">
<button aria-label="{{w.name}}" style="width: {{w.size}}; height: {{w.size}}; border-radius: 12px; background: {{w.c}}; border: 3px solid {{w.ring}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center">
<sc-if value="{{w.on}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 11 L9 16 L18 6" stroke="#0E0E11" stroke-width="4" fill="none" stroke-linecap="round"></path></svg></sc-if>
</button>
</sc-for>
</div>
</div>

<div style="position: absolute; right: 32px; bottom: 32px; display: flex; gap: 12px; align-items: stretch">
<button style="min-height: 84px; padding: 0 22px; border-radius: 16px; background: #1F1F26; color: #F4F4F6; border: 3px solid #3A3A46; font-family: 'Russo One', sans-serif; font-size: 22px; display: flex; align-items: center; gap: 10px">RACE<svg width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 3 L25 14 L6 25 Z" fill="#F4F4F6"></path></svg></button>
<button style="min-height: 84px; padding: 0 30px; border-radius: 16px; background: linear-gradient(180deg, #8CF25B, #2FB52A); color: #0E0E11; border: 4px solid #0E0E11; box-shadow: 0 7px 0 #0E0E11; font-family: 'Russo One', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-size: 30px; line-height: 1">BUY</span>
<span style="font-size: 18px; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="#FFE600" stroke="#0E0E11" stroke-width="2.5"></circle></svg>2,400</span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paint":{"editor":"color","default":"#FFD500","options":["#FFD500","#FF3B30","#2D5BFF","#2EE6D6"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const paint = this.props.paint ?? '#FFD500';
const mk = (label, v, d) => ({
label, text: d ? `${v} → ${v + d}` : `${v}`, numColor: d > 0 ? '#7BE07B' : (d < 0 ? '#FF7B7B' : '#FFE600'),
segs: Array.from({ length: 10 }, (_, i) => ({ c: i < Math.min(v, v + d) ? '#FFE600' : (i < Math.max(v, v + d) ? (d > 0 ? '#7BE07B' : '#FF7B7B') : '#2C2C34') }))
});
const parts = [
['BODY', 'Rally Shell', 'Equipped', 'M4 24 L10 14 H24 L32 22 V26 H4 Z', 'eq'],
['WHEELS', 'Grip Slicks', 'Previewing · 2,400', 'M18 4 A14 14 0 1 1 18 32 A14 14 0 1 1 18 4 Z M18 12 A6 6 0 1 0 18 24 A6 6 0 1 0 18 12 Z', 'prev'],
['SPOILER', 'Twin Strut', 'Owned', 'M3 10 H33 V15 H3 Z M9 15 H13 V28 H9 Z M23 15 H27 V28 H23 Z', ''],
['DECAL', 'Flame Stripe', 'Owned', 'M3 26 C8 18 10 22 14 14 C16 20 19 16 22 8 C24 16 28 14 33 10 L33 26 Z', ''],
['BOOST', 'Nitro Cell II', 'Locked · level 20', 'M12 4 H24 V8 H22 V30 C22 32 20 33 18 33 C16 33 14 32 14 30 V8 H12 Z', 'lock']
].map(([slot, name, status, icon, st]) => ({
slot, name, status: st === 'eq' ? '✓ ' + status : status, icon, statusColor: st === 'eq' ? '#7BE07B' : (st === 'prev' ? '#0E0E11' : (st === 'lock' ? '#9AA0AA' : '#C7C7D0')),
bg: st === 'prev' ? '#FFE600' : (st === 'lock' ? '#18181D' : '#1F1F26'), fg: st === 'prev' ? '#0E0E11' : (st === 'lock' ? '#9AA0AA' : '#F4F4F6'),
border: st === 'prev' ? '#FFE600' : '#34343E', thumbBg: st === 'prev' ? 'rgba(0,0,0,0.15)' : '#2A2A33', iconFill: st === 'lock' ? '#6B6B75' : '#FFE600'
}));
const finishes = ['Matte', 'Gloss', 'Chrome'].map((l, i) => ({ label: l, bg: i === 1 ? '#FFE600' : 'transparent', fg: i === 1 ? '#0E0E11' : '#C7C7D0' }));
const swatches = [['Volt yellow', '#FFD500'], ['Race red', '#FF3B30'], ['Cobalt', '#2D5BFF'], ['Teal', '#2EE6D6'], ['Ghost white', '#F4F4F6'], ['Matte black', '#3A3A44']]
.map(([name, c]) => { const on = c.toLowerCase() === paint.toLowerCase(); return { name, c, on, size: on ? '54px' : '44px', ring: on ? '#FFFFFF' : '#0E0E11' }; });
return { stats: [mk('TOP SPEED', 7, 0), mk('ACCEL', 8, 0), mk('HANDLING', 6, 2), mk('DRIFT', 9, -1)], parts, finishes, swatches };
}
}
</script>
</body>
</html>
